<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38020"/>
      <stop offset="100%" stop-color="#faae40"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="50" y="55" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.5">MissionForge — Edge-Native Multi-Agent Architecture</text>
  <text x="50" y="80" fill="#94a3b8" font-size="13">Cloudflare Workers • Workers AI (Llama 3.3 70B) • Durable Objects SQLite • Agents SDK</text>

  <!-- TIER 1: CLIENT LAYER -->
  <rect x="50" y="115" width="280" height="530" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="50" y="115" width="280" height="42" rx="16" fill="#1e293b" opacity="0.6"/>
  <text x="75" y="142" fill="#38bdf8" font-size="13" font-weight="700">CLIENT TIER (REACT + VITE)</text>

  <!-- Client components -->
  <rect x="70" y="175" width="240" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="200" fill="#f8fafc" font-size="12" font-weight="700">Workbench Workspace</text>
  <text x="85" y="222" fill="#94a3b8" font-size="11">Dual-Mode Auth (Guest + GitHub)</text>

  <rect x="70" y="255" width="240" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="280" fill="#f8fafc" font-size="12" font-weight="700">Execution Task Board</text>
  <text x="85" y="302" fill="#94a3b8" font-size="11">Real-time status chip sync</text>

  <rect x="70" y="335" width="240" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="360" fill="#f8fafc" font-size="12" font-weight="700">Live Timeline View</text>
  <text x="85" y="382" fill="#94a3b8" font-size="11">Chronological AgentEvent stream</text>

  <rect x="70" y="415" width="240" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="85" y="440" fill="#f8fafc" font-size="12" font-weight="700">Report & Evidence View</text>
  <text x="85" y="462" fill="#94a3b8" font-size="11">Decision matrix + Corpus sources</text>

  <rect x="70" y="520" width="240" height="95" rx="10" fill="#090d16" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="85" y="545" fill="#f43f5e" font-size="11" font-weight="700">Transport Layer</text>
  <text x="85" y="567" fill="#cbd5e1" font-size="11">@cloudflare/agents WebSocket</text>
  <text x="85" y="587" fill="#64748b" font-size="10">Sub-50ms duplex state mutations</text>

  <!-- TIER 2: CLOUDFLARE EDGE & DURABLE OBJECTS -->
  <rect x="380" y="115" width="450" height="530" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="380" y="115" width="450" height="42" rx="16" fill="#1e293b" opacity="0.6"/>
  <text x="405" y="142" fill="#faae40" font-size="13" font-weight="700">CLOUDFLARE GLOBAL EDGE • STATEFUL AGENT ACTOR</text>

  <!-- Worker Router -->
  <rect x="405" y="175" width="400" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="425" y="198" fill="#f8fafc" font-size="12" font-weight="700">Edge Gateway: routeAgentRequest()</text>
  <text x="425" y="217" fill="#94a3b8" font-size="11">OAuth Verification • Asset Hosting • DO Routing</text>

  <!-- DO Container -->
  <rect x="405" y="250" width="400" height="275" rx="12" fill="#090d16" stroke="#f38020" stroke-width="1.5"/>
  <text x="425" y="278" fill="#faae40" font-size="12" font-weight="800">MissionAgent (Durable Object Actor)</text>
  <text x="685" y="278" fill="#34d399" font-size="10" font-weight="700">● EMBEDDED SQLITE</text>

  <!-- 4-Agent Pipeline inside DO -->
  <rect x="425" y="300" width="360" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="326" fill="#f8fafc" font-size="11" font-weight="700">🧠 Manager Agent</text>
  <text x="590" y="326" fill="#94a3b8" font-size="10">Task Decomposition Plan</text>

  <rect x="425" y="352" width="360" height="42" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="440" y="378" fill="#f43f5e" font-size="11" font-weight="700">🔎 Researcher Agent</text>
  <text x="590" y="378" fill="#94a3b8" font-size="10">Corpus Tool Calling</text>

  <rect x="425" y="404" width="360" height="42" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="440" y="430" fill="#fbbf24" font-size="11" font-weight="700">📊 Analyst Agent</text>
  <text x="590" y="430" fill="#94a3b8" font-size="10">Multi-Factor Trade-offs</text>

  <rect x="425" y="456" width="360" height="42" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
  <text x="440" y="482" fill="#c084fc" font-size="11" font-weight="700">📝 Reporter Agent</text>
  <text x="590" y="482" fill="#94a3b8" font-size="10">Executive Recommendation</text>

  <!-- SQLite Persistence Box -->
  <rect x="405" y="545" width="400" height="75" rx="10" fill="#131d31" stroke="#38bdf8" stroke-width="1"/>
  <text x="425" y="572" fill="#38bdf8" font-size="12" font-weight="700">Collocated SQLite Persistence (DO Storage)</text>
  <text x="425" y="594" fill="#94a3b8" font-size="11">Tasks, Events, Reports & Messages persist across page reloads (F5)</text>

  <!-- TIER 3: INFERENCE & TOOLS -->
  <rect x="880" y="115" width="270" height="530" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="880" y="115" width="270" height="42" rx="16" fill="#1e293b" opacity="0.6"/>
  <text x="905" y="142" fill="#a855f7" font-size="13" font-weight="700">AI INFERENCE & TOOLS</text>

  <!-- Workers AI Box -->
  <rect x="900" y="175" width="230" height="150" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="920" y="205" fill="#f8fafc" font-size="12" font-weight="700">Cloudflare Workers AI</text>
  <text x="920" y="228" fill="#e2e8f0" font-size="11">Llama 3.3 70B Instruct</text>
  <text x="920" y="246" fill="#94a3b8" font-size="10">fp8-fast edge inference</text>
  <rect x="920" y="265" width="190" height="36" rx="6" fill="#090d16" stroke="#475569"/>
  <text x="930" y="287" fill="#34d399" font-size="10 font-mono">Fallback: Llama 3.1 8B</text>

  <!-- Research Tool Box -->
  <rect x="900" y="350" width="230" height="135" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="920" y="380" fill="#f8fafc" font-size="12" font-weight="700">Research Corpus Tool</text>
  <text x="920" y="403" fill="#cbd5e1" font-size="11">Factual evidence retrieval</text>
  <text x="920" y="423" fill="#94a3b8" font-size="10">• Latency & throughput specs</text>
  <text x="920" y="443" fill="#94a3b8" font-size="10">• Storage & partition models</text>
  <text x="920" y="463" fill="#94a3b8" font-size="10">• Zero hallucinated citations</text>

  <!-- Cloudflare Workflows Box -->
  <rect x="900" y="510" width="230" height="110" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="920" y="540" fill="#f8fafc" font-size="12" font-weight="700">Cloudflare Workflows</text>
  <text x="920" y="563" fill="#cbd5e1" font-size="11">step.do() Checkpoints</text>
  <text x="920" y="583" fill="#94a3b8" font-size="10">Durable background batch recovery</text>

  <!-- CONNECTING ARROWS -->
  <!-- Client to DO -->
  <path d="M 310 560 L 405 560" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="325" y="548" fill="#38bdf8" font-size="10" font-weight="600">WebSocket</text>

  <!-- Researcher to Tool -->
  <path d="M 785 373 L 900 373" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- DO to Workers AI -->
  <path d="M 785 321 L 900 240" stroke="#a855f7" stroke-width="2"/>
  <path d="M 785 425 L 900 270" stroke="#a855f7" stroke-width="2"/>
  <path d="M 785 477 L 900 300" stroke="#a855f7" stroke-width="2"/>
</svg>
